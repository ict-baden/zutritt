<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zutritt Banner</title>
<style>
  /* README-Titelbild 1280×420, gerendert von banner.js nach docs/assets/banner.png; Verlauf wie das App-Icon (richtlinien/08) */
  :root { --a: #22c3a6; --b: #3b6cf6; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; height: 420px; overflow: hidden; font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  .banner {
    position: relative; width: 1280px; height: 420px; overflow: hidden; color: #fff;
    background: radial-gradient(circle at 18% 20%, #ffffff26, transparent 42%), linear-gradient(135deg, var(--a), var(--b));
  }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(#ffffff16 1px, transparent 1px); background-size: 22px 22px; mask-image: linear-gradient(90deg, #000 0%, transparent 60%); }
  .text { position: absolute; left: 72px; top: 86px; width: 540px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 72px; height: 72px; filter: drop-shadow(0 8px 20px #0004); }
  h1 { font-size: 76px; font-weight: 700; letter-spacing: -1.5px; line-height: 1; }
  .tag { margin-top: 22px; font-size: 30px; font-weight: 600; opacity: .96; }
  .sub { margin-top: 12px; font-size: 19px; line-height: 1.45; opacity: .85; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  .chips { margin-top: 22px; display: flex; gap: 8px; flex-wrap: wrap; }
  .chips span { font: 600 13px "Segoe UI", system-ui, sans-serif; padding: 6px 12px; border-radius: 999px; background: #ffffff24; border: 1px solid #ffffff3a; }
  .shot {
    position: absolute; right: -110px; top: 40px; width: 780px; border-radius: 14px; overflow: hidden;
    box-shadow: 0 40px 80px #0007, 0 0 0 1px #ffffff30;
    transform: perspective(1600px) rotateY(-16deg) rotateX(6deg) rotateZ(1deg);
  }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="banner">
    <div class="dots"></div>
    <div class="text">
      <div class="brand">
        <img src="../../docs/assets/logo.svg" alt="">
        <h1>Zutritt</h1>
      </div>
      <div class="tag">Who can access what?</div>
      <div class="sub">Share and NTFS permissions resolved down to people – with findings, history and a report to sign off.</div>
      <div class="chips"><span>SMB + NTFS</span><span>Groups → people</span><span>14 checks</span><span>Excel &amp; PDF</span></div>
    </div>
    <div class="shot"><img src="../../docs/assets/screenshots/folders-light.png" alt=""></div>
  </div>
</body>
</html>
