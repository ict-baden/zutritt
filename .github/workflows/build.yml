name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # für die Releases

# Läufe auf demselben Branch nacheinander, damit sich die 'latest'-Releases nicht überholen
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version bestimmen
        id: version
        shell: pwsh
        run: |
          # Tag v1.2.3 -> 1.2.3, sonst Version aus der csproj mit Build-Nummer
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $base = ([xml](Get-Content src/Zutritt/Zutritt.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            $v = "$base-ci.$env:GITHUB_RUN_NUMBER"
          }
          # MSI kennt nur Zahlen. CI-Builds: Version aus der csproj + Lauf-Nummer als 4. Stelle (z. B. 0.1.0.12).
          # Windows Installer vergleicht nur drei Stellen, deshalb ersetzen sich CI-Builds gegenseitig
          # (AllowSameVersionUpgrades), und ein Release v0.1.1 ist immer neuer als jeder 0.1.0-CI-Build.
          $core = $v -replace '[-+].*$', ''
          $msi = if ($env:GITHUB_REF_TYPE -eq 'tag') { $core } else { "$core.$env:GITHUB_RUN_NUMBER" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "msi=$msi" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v  MSI: $msi"

      - name: Restore
        run: dotnet restore Zutritt.sln

      - name: Build
        run: dotnet build Zutritt.sln -c Release --no-restore

      - name: Tests
        # Die Integrationstests legen echte Testordner, Freigaben und lokale Konten an (Runner läuft als Admin) und räumen auf.
        run: dotnet test Zutritt.sln -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - name: Testergebnisse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Testergebnisse
          path: TestResults/*.trx
          if-no-files-found: ignore

      - name: Publish
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $common = @('src/Zutritt/Zutritt.csproj', '-c', 'Release', '-r', 'win-x64', '-p:PublishSingleFile=true', "-p:Version=$v", '-p:DebugType=none')
          # Benötigt .NET 10 Desktop Runtime auf dem Zielgerät
          dotnet publish @common --self-contained false -o out/framework
          # Ohne Runtime-Abhängigkeit, Grundlage für die MSI
          dotnet publish @common --self-contained true -o out/self-contained
          # Eine einzige Exe zum Direkt-Download: Runtime und native DLLs (SQLite, WPF) eingebettet
          dotnet publish @common --self-contained true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out/standalone

      - name: Pakete schnüren
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item README.md out/framework/
          Compress-Archive -Path out/framework/* -DestinationPath "dist/Zutritt-$v-win-x64-framework.zip"
          Copy-Item out/standalone/Zutritt.exe dist/Zutritt.exe

      - name: MSI bauen
        shell: pwsh
        run: |
          # Self-contained: läuft ohne installierte .NET-Runtime
          dotnet build installer/Zutritt.Installer.wixproj -c Release "-p:PublishDir=$PWD/out/self-contained/" -p:ProductVersion=${{ steps.version.outputs.msi }}
          Copy-Item installer/bin/Release/Zutritt.msi "dist/Zutritt-${{ steps.version.outputs.version }}-x64.msi"
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Zutritt-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Release erstellen (nur bei Tag v*)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist/*).FullName --title "Zutritt $env:GITHUB_REF_NAME" --generate-notes

      - name: "Release 'latest' aktualisieren (Push auf main)"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # Rollierende Vorabversion: immer der neueste main-Stand als direkter Download
          gh release delete latest --cleanup-tag --yes 2>$null
          $notes = "Automatischer Build von main ($($env:GITHUB_SHA.Substring(0,7))), Version ${{ steps.version.outputs.version }}.`n`n" +
                   "- **Zutritt-…-x64.msi**: Installer für alle Benutzer (Intune/GPO)`n" +
                   "- **Zutritt.exe**: eine Datei, läuft ohne Installation und ohne .NET-Runtime`n" +
                   "- **Zutritt-…-framework.zip**: kleine Variante, braucht die .NET 10 Desktop Runtime"
          gh release create latest (Get-ChildItem dist/*).FullName --prerelease --target $env:GITHUB_SHA --title "Latest Build (main)" --notes $notes
