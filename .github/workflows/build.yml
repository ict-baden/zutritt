# Nach der Vorlage aus ict-baden/richtlinien (vorlagen/.github/workflows/build.yml), Windows-Desktop-App mit MSI.
# Dazu: Job „linux“ testet den plattformneutralen Teil (richtlinien/02); der Job „windows“ startet erst, wenn er grün
# ist, und veröffentlicht selbst – wie in der Vorlage, ohne Umweg über Artefakte (deren Speicher teilen sich alle Repos
# der Organisation, ist er voll, darf das kein Release verhindern). Jedes Release enthält zusätzlich eine Stückliste
# (SBOM, richtlinien/06), öffentliche Repos einen Herkunftsnachweis (richtlinien/05).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Läufe auf demselben Branch nacheinander, damit sich die 'latest'-Releases nicht überholen
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  APP: "Zutritt"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Signieren nur, wenn die Organisation Artifact Signing eingerichtet hat (siehe richtlinien/05-signieren.md)
  # und nicht bei Pull Requests (dort gibt es kein OIDC-Token mit den nötigen Rechten).
  SIGN: ${{ vars.SIGNING_ACCOUNT != '' && github.event_name != 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Schriften für die PDF-Tests
        # Segoe UI und Arial gibt es unter Linux nicht; freie Schriften für den PDF-Bericht (Liberation ist metrisch gleich Arial)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends fonts-dejavu-core fonts-liberation

      - name: Build
        run: dotnet build tests/Zutritt.Tests -c Release -f net10.0

      - name: Tests
        # Nur der plattformneutrale Teil (Auswertung, Regeln, Vergleich, Speicher, Berichte). NTFS, Freigaben und Konten
        # testet der Job „windows“.
        run: dotnet test tests/Zutritt.Tests -c Release -f net10.0 --no-build --logger "trx;LogFileName=tests-linux.trx" --results-directory TestResults

      - name: Testergebnisse
        if: always()
        continue-on-error: true # wie unter Windows: nur zur Fehlersuche
        uses: actions/upload-artifact@v7
        with:
          name: Testergebnisse-linux
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7

  windows:
    # Erst bauen und veröffentlichen, wenn der plattformneutrale Teil auch unter Linux grün ist
    needs: linux
    runs-on: windows-latest
    permissions:
      contents: write # für die Releases
      id-token: write # Anmeldung bei Azure Artifact Signing (OIDC) und Herkunftsnachweis
      attestations: write # Herkunftsnachweis
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version bestimmen
        id: version
        shell: pwsh
        run: |
          # Tag v1.2.3 -> 1.2.3, sonst Version aus der csproj mit Build-Nummer
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $base = ([xml](Get-Content "src/$env:APP/$env:APP.csproj")).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            $v = "$base-ci.$env:GITHUB_RUN_NUMBER"
          }
          # MSI kennt nur Zahlen. CI-Builds: Version + Lauf-Nummer als 4. Stelle (z. B. 0.1.0.12).
          # Windows Installer vergleicht nur drei Stellen, deshalb ersetzen sich CI-Builds gegenseitig
          # (AllowSameVersionUpgrades), und ein Release v0.1.1 ist immer neuer als jeder 0.1.0-CI-Build.
          $core = $v -replace '[-+].*$', ''
          $msi = if ($env:GITHUB_REF_TYPE -eq 'tag') { $core } else { "$core.$env:GITHUB_RUN_NUMBER" }
          # Dateinamen: Releases aus einem Tag mit Version, sonst fest, damit die Links auf 'latest' dauerhaft gelten
          $suffix = if ($env:GITHUB_REF_TYPE -eq 'tag') { "-$v" } else { '' }
          "version=$v" >> $env:GITHUB_OUTPUT
          "msi=$msi" >> $env:GITHUB_OUTPUT
          "suffix=$suffix" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v  MSI: $msi  Signieren: $env:SIGN"

      - name: Restore
        run: dotnet restore "${{ env.APP }}.sln"

      - name: Build
        run: dotnet build "${{ env.APP }}.sln" -c Release --no-restore

      - name: Tests
        # Die Integrationstests legen echte Testordner, Freigaben und lokale Konten an (der Runner läuft als Admin) und
        # räumen auf. Die Test-Ziele nacheinander, sonst kommen sich die echten Freigaben und Konten in die Quere.
        run: dotnet test "${{ env.APP }}.sln" -c Release --no-build -p:TestTfmsInParallel=false --logger "trx;LogFilePrefix=tests" --results-directory TestResults

      - name: Testergebnisse
        if: always()
        # Nur zur Fehlersuche: Ist der Artefaktspeicher der Organisation voll, bleibt der Lauf trotzdem grün
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: Testergebnisse-windows
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $common = @("src/$env:APP/$env:APP.csproj", '-c', 'Release', '-r', 'win-x64', '-p:PublishSingleFile=true', "-p:Version=$v", '-p:DebugType=none')
          # Benötigt .NET 10 Desktop Runtime auf dem Zielgerät
          dotnet publish @common --self-contained false -o out/framework
          if ($LASTEXITCODE -ne 0) { throw "Publish (framework) fehlgeschlagen ($LASTEXITCODE)" }
          # Ohne Runtime-Abhängigkeit, Grundlage für die MSI
          dotnet publish @common --self-contained true -o out/self-contained
          if ($LASTEXITCODE -ne 0) { throw "Publish (self-contained) fehlgeschlagen ($LASTEXITCODE)" }
          # Eine einzige Exe zum Direkt-Download: Runtime und native DLLs (SQLite, WPF) eingebettet
          dotnet publish @common --self-contained true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out/standalone
          if ($LASTEXITCODE -ne 0) { throw "Publish (Einzeldatei) fehlgeschlagen ($LASTEXITCODE)" }

      # ---- Signieren der Programmdateien (vor dem Packen, damit ZIP und MSI signierte Dateien enthalten) ----
      - name: Bei Azure anmelden
        if: env.SIGN == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Exe signieren (framework)
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\out\framework
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Exe signieren (self-contained, für die MSI)
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\out\self-contained
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Exe signieren (Einzeldatei)
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\out\standalone
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Pakete schnüren
        shell: pwsh
        run: |
          # Lizenztexte gehören neben die Exe, ins ZIP und in die MSI (richtlinien/06) – die csproj kopiert sie beim Publish
          foreach ($dir in 'out/framework', 'out/self-contained') {
            foreach ($file in 'LICENSE', 'THIRD-PARTY-NOTICES.txt') {
              if (-not (Test-Path "$dir/$file")) { throw "$dir/$file fehlt: src/$env:APP/$env:APP.csproj muss $file in den Publish-Ordner kopieren." }
            }
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item README.md out/framework/
          Compress-Archive -Path out/framework/* -DestinationPath "dist/$env:APP${{ steps.version.outputs.suffix }}-win-x64-framework.zip"
          Copy-Item "out/standalone/$env:APP.exe" "dist/$env:APP.exe"

      - name: MSI bauen
        shell: pwsh
        run: |
          # Self-contained: läuft ohne installierte .NET-Runtime
          dotnet build "installer/$env:APP.Installer.wixproj" -c Release "-p:PublishDir=$PWD/out/self-contained/" -p:ProductVersion=${{ steps.version.outputs.msi }}
          if ($LASTEXITCODE -ne 0) { throw "MSI-Build fehlgeschlagen ($LASTEXITCODE)" }
          Copy-Item "installer/bin/Release/$env:APP.msi" "dist/$env:APP${{ steps.version.outputs.suffix }}-x64.msi"

      - name: MSI signieren
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Stückliste (SBOM)
        shell: pwsh
        run: |
          # CycloneDX-Stückliste der ausgelieferten Pakete und Runtime-Pakete (richtlinien/06). Die WiX-Custom-Action
          # der MSI steht in THIRD-PARTY-NOTICES.txt.
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool restore fehlgeschlagen ($LASTEXITCODE)" }
          $file = "dist/$env:APP${{ steps.version.outputs.suffix }}-sbom.cdx.json"
          $sbom = @("src/$env:APP/$env:APP.csproj", '--recursive', '--exclude-dev', '--output', 'dist',
                    '--filename', (Split-Path $file -Leaf), '--output-format', 'Json',
                    '--set-name', $env:APP, '--set-version', '${{ steps.version.outputs.version }}')
          dotnet dotnet-CycloneDX @sbom
          if ($LASTEXITCODE -ne 0) { throw "SBOM fehlgeschlagen ($LASTEXITCODE)" }
          # Nur was die Pakete wirklich enthalten: deps.json des letzten Publish (Einzeldatei, self-contained)
          $deps = @(Get-ChildItem "src/$env:APP/obj/Release/*/win-x64/$env:APP.deps.json")
          if ($deps.Count -ne 1) { throw "deps.json des Publish nicht eindeutig gefunden ($($deps.Count))" }
          ./.github/scripts/sbom-shipped.ps1 -Sbom $file -DepsJson $deps[0].FullName

      - name: Prüfsummen
        shell: pwsh
        run: |
          # Nach dem Signieren, sonst stimmen die Summen nicht. Zeilenenden LF: mit CRLF scheitert `sha256sum -c` unter Linux.
          $sums = Get-ChildItem dist -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", ($sums -join "`n") + "`n", [Text.Encoding]::ASCII)
          Get-Content dist/SHA256SUMS.txt

      - name: Herkunftsnachweis
        # Nur für öffentliche Repos; für private bräuchte es GitHub Enterprise (richtlinien/05)
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'

      - name: Dateien als Artefakt
        # Zum Ausprobieren eines Pull Requests. Die Releases unten nehmen dist/ direkt, deshalb darf das Hochladen
        # scheitern (voller Artefaktspeicher), ohne dass ein Release ausfällt.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP }}-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Release erstellen (nur bei Tag v*)
        if: github.ref_type == 'tag' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # v1.0.0-rc1 und ähnliche: Vorabversion, nicht „Latest“
          $pre = if ($env:GITHUB_REF_NAME -match '-') { @('--prerelease') } else { @() }
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist/*).FullName --title "$env:APP $env:GITHUB_REF_NAME" --generate-notes @pre
          if ($LASTEXITCODE -ne 0) { throw "Release ließ sich nicht anlegen ($LASTEXITCODE)" }

      - name: "Release 'latest' aktualisieren (main)"
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # Rollierendes Release: immer der neueste main-Stand, unter festen Links (Einzelheiten im Skript)
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/latest"
          $built = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')
          $signed = if ($env:SIGN -eq 'true') { 'signiert' } else { 'noch nicht signiert' }
          $notes = "Automatischer Build von main ($($env:GITHUB_SHA.Substring(0,7))), Version ${{ steps.version.outputs.version }}, gebaut $built UTC, $signed.`n`n" +
                   "Die Links bleiben gleich und zeigen immer auf den neuesten Build:`n`n" +
                   "- **[$env:APP-x64.msi]($base/$env:APP-x64.msi)**: Installer für alle Benutzer (Intune/GPO)`n" +
                   "- **[$env:APP.exe]($base/$env:APP.exe)**: eine Datei, läuft ohne Installation und ohne .NET-Runtime`n" +
                   "- **[$env:APP-win-x64-framework.zip]($base/$env:APP-win-x64-framework.zip)**: kleine Variante, braucht die .NET 10 Desktop Runtime`n" +
                   "- [SHA256SUMS.txt]($base/SHA256SUMS.txt): Prüfsummen`n" +
                   "- [$env:APP-sbom.cdx.json]($base/$env:APP-sbom.cdx.json): Stückliste der Bestandteile (CycloneDX)"
          ./.github/scripts/release-latest.ps1 -Notes $notes -Title "Latest Build (main) – ${{ steps.version.outputs.version }}"
